# =============================================================================
# FitLoop - Render Blueprint
# =============================================================================
# Deploy with: render blueprint sync
# Or connect your GitHub repo and Render will auto-detect this file

services:
  # =============================================================================
  # BACKEND API (FastAPI)
  # =============================================================================
  - type: web
    name: fitloop-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitloop-db
          property: connectionString

  # =============================================================================
  # FRONTEND (React/Vite - Static Site)
  # =============================================================================
  - type: web
    name: fitloop-web
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fitloop-api
          property: host
          # Will be like: https://fitloop-api.onrender.com

  # =============================================================================
  # DATABASE (PostgreSQL)
  # =============================================================================
databases:
  - name: fitloop-db
    plan: free
    region: oregon
